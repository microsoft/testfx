jobs:
- job: BuildXLPerformance
  displayName: Windows BuildXL performance comparison
  dependsOn: DetectChanges
  # Keep the comparison separate from shipping/test outputs and run it on product
  # changes, main CI, nightly, and manual builds. Unknown classification runs it.
  condition: and(succeededOrFailed(), ne(dependencies.DetectChanges.outputs['detect.infrastructureOnly'], 'true'), ne(dependencies.DetectChanges.outputs['detect.xmlDocsOnly'], 'true'), ne(dependencies.DetectChanges.outputs['detect.hasProductChanges'], 'false'))
  timeoutInMinutes: 90
  cancelTimeoutInMinutes: 5
  pool:
    name: NetCore-Public
    demands: ImageOverride -equals windows.vs2026preview.scout.amd64.open
  variables:
    BuildXLPerfResults: $(Build.ArtifactStagingDirectory)\buildxl-performance
    # Do not let reused agents supply a previous run's action/output state.
    # Package downloads are primed outside measured samples and never timed as cold-network work.
    NUGET_PACKAGES: $(Agent.TempDirectory)\buildxl-perf-nuget-$(Build.BuildId)-$(System.JobAttempt)
  steps:
  - checkout: self
    fetchDepth: 1
    clean: true
    persistCredentials: false

  - pwsh: |
      .\eng\buildxl\benchmark.ps1 -SelfTest
      exit $LASTEXITCODE
    displayName: Validate performance statistics and exports

  - pwsh: |
      .\eng\buildxl\benchmark.ps1 -Samples 3 -Jobs 8 -NoJournal `
        -ResultsDirectory '$(BuildXLPerfResults)'
      exit $LASTEXITCODE
    displayName: Compare matched MSBuild and BuildXL builds
    # No OAuth token, remote action cache, or optional workload installation is needed.

  - pwsh: |
      $root = '$(BuildXLPerfResults)'
      $hasEvidence = Test-Path -LiteralPath $root
      $hasReport = Test-Path -LiteralPath (Join-Path $root 'benchmark.junit.xml') -PathType Leaf
      Write-Host "##vso[task.setvariable variable=BuildXLPerfHasEvidence]$hasEvidence"
      Write-Host "##vso[task.setvariable variable=BuildXLPerfHasReport]$hasReport"
      $summary = Join-Path $root 'summary.md'
      if (Test-Path -LiteralPath $summary -PathType Leaf) {
        Write-Host "##vso[task.uploadsummary]$summary"
      }
    displayName: Locate performance evidence and upload summary
    condition: always()

  # These stable benchmark-case names carry actual measured sample durations
  # into Azure Test Analytics. They are not product unit-test or coverage counts.
  - task: PublishTestResults@2
    displayName: Publish build performance duration trends
    condition: and(always(), eq(variables.BuildXLPerfHasReport, 'True'))
    inputs:
      testResultsFormat: JUnit
      searchFolder: $(BuildXLPerfResults)
      testResultsFiles: benchmark.junit.xml
      testRunTitle: BuildXL versus MSBuild performance
      mergeTestResults: true
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true
      publishRunAttachments: false

  - task: PublishPipelineArtifact@1
    displayName: Publish build performance evidence
    condition: and(always(), eq(variables.BuildXLPerfHasEvidence, 'True'))
    inputs:
      targetPath: $(BuildXLPerfResults)
      artifact: buildxl-performance-Attempt$(System.JobAttempt)
