jobs:
- job: BuildXL
  displayName: Windows BuildXL repository build
  dependsOn: DetectChanges
  # The solution includes samples as well as products. Unknown classification runs it.
  condition: and(succeededOrFailed(), ne(dependencies.DetectChanges.outputs['detect.infrastructureOnly'], 'true'), ne(dependencies.DetectChanges.outputs['detect.xmlDocsOnly'], 'true'), or(ne(dependencies.DetectChanges.outputs['detect.hasProductChanges'], 'false'), ne(dependencies.DetectChanges.outputs['detect.hasSamplesChanges'], 'false')))
  timeoutInMinutes: 90
  cancelTimeoutInMinutes: 5
  pool:
    name: NetCore-Public
    demands: ImageOverride -equals windows.vs2026preview.scout.amd64.open
  strategy:
    matrix:
      Debug:
        BuildXLConfiguration: Debug
      Release:
        BuildXLConfiguration: Release
  variables:
    # Match Arcade's public-job policy; the CodeQL tracer writes outside the BuildXL sandbox.
    ${{ if eq(variables['System.TeamProject'], 'public') }}:
      Codeql.SkipTaskAutoInjection: true
      skipComponentGovernanceDetection: true
    BuildXLArtifacts: $(Build.ArtifactStagingDirectory)\buildxl-$(BuildXLConfiguration)-Attempt$(System.JobAttempt)
    # Do not let reused agents supply a previous run's action/output state.
    NUGET_PACKAGES: $(Agent.TempDirectory)\buildxl-nuget-$(Build.BuildId)-$(System.JobAttempt)-$(BuildXLConfiguration)
  steps:
  - checkout: self
    fetchDepth: 1
    clean: true
    persistCredentials: false

  - pwsh: |
      .\eng\buildxl.ps1 -Project TestFx.slnx -Configuration '$(BuildXLConfiguration)' -Jobs 8 -NoJournal
      exit $LASTEXITCODE
    displayName: Build repository with BuildXL
    # Restore uses the pinned SDK; BuildXL schedules the solution's native MSBuild graph.

  - pwsh: |
      $root = '$(Build.SourcesDirectory)\artifacts\buildxl'
      $evidence = '$(BuildXLArtifacts)'
      $hasEvidence = $false
      foreach ($relativePath in @('toolchain.json', 'config.dsc', 'logs', 'Out\Logs\MSBuild')) {
        $source = Join-Path $root $relativePath
        if (Test-Path -LiteralPath $source) {
          $destination = Join-Path $evidence $relativePath
          New-Item -ItemType Directory -Path (Split-Path $destination -Parent) -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination (Split-Path $destination -Parent) -Recurse -Force
          $hasEvidence = $true
        }
      }
      Write-Host "##vso[task.setvariable variable=BuildXLHasEvidence]$hasEvidence"
    displayName: Collect BuildXL engine and project logs
    condition: always()

  - task: PublishPipelineArtifact@1
    displayName: Publish BuildXL build logs
    condition: and(always(), eq(variables.BuildXLHasEvidence, 'True'))
    inputs:
      targetPath: $(BuildXLArtifacts)
      artifact: buildxl-$(BuildXLConfiguration)-Attempt$(System.JobAttempt)
