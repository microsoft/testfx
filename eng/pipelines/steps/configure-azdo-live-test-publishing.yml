steps:
- pwsh: |
    $accessToken = $env:SYSTEM_ACCESSTOKEN
    $enabled = -not [string]::IsNullOrWhiteSpace($accessToken) -and $accessToken -ne '$(System.AccessToken)'
    if ($enabled) {
      Write-Host 'A pipeline OAuth token is available; enabling Azure DevOps live test-result publishing.'
      Write-Host '##vso[task.setvariable variable=TESTFX_AZDO_LIVE_PUBLISHING]true'
      Write-Host '##vso[task.setvariable variable=TESTFX_AZDO_LIVE_PUBLISHING_SUCCEEDED]false'
      Write-Host '##vso[task.setvariable variable=AZDO_LIVE_PUBLISHING_ARGS]--publish-azdo-test-results'
      Write-Host "##vso[task.setvariable variable=AZDO_LIVE_PUBLISHING_STARTED_AT]$([DateTimeOffset]::UtcNow.ToString('o'))"
    }
    else {
      Write-Host 'Azure DevOps live test-result publishing is disabled because the OAuth token is unavailable. The PublishTestResults fallback will be used.'
      Write-Host '##vso[task.setvariable variable=TESTFX_AZDO_LIVE_PUBLISHING]false'
      Write-Host '##vso[task.setvariable variable=TESTFX_AZDO_LIVE_PUBLISHING_SUCCEEDED]false'
      Write-Host '##vso[task.setvariable variable=AZDO_LIVE_PUBLISHING_ARGS]'
      Write-Host '##vso[task.setvariable variable=AZDO_LIVE_PUBLISHING_STARTED_AT]'
    }
  displayName: Configure Azure DevOps test-result publishing
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
