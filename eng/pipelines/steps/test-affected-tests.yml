parameters:
- name: solution
  type: string
  values:
  - TestFx.slnx
  - NonWindowsTests.slnf
- name: affectedTestsMode
  type: string
  values:
  - collect
  - run

steps:
# The SDK owns DOTNET_CLI_TEST_AFFECTED_TESTS_MODE; pipelines must not set it.
- pwsh: |
    $affectedTestsMode = '${{ parameters.affectedTestsMode }}'
    if ($affectedTestsMode -eq 'collect' -and $IsWindows) {
      & .\eng\collect-affected-test-maps.ps1 -Configuration '$(_BuildConfig)'
      exit $LASTEXITCODE
    }
    if ($affectedTestsMode -eq 'run') {
      $PSNativeCommandUseErrorActionPreference = $false
      Write-Host "##vso[task.setvariable variable=AffectedTestsSucceeded]false"
      $repository = '$(Build.SourcesDirectory)'
      $shallow = & git -C $repository rev-parse --is-shallow-repository
      if ($LASTEXITCODE -ne 0) {
        Write-Host "##vso[task.logissue type=warning]Cannot inspect affected-test Git history; running the full test suite."
        exit 0
      }
      $fetchArguments = @('-C', $repository, 'fetch', '--no-tags', '--no-recurse-submodules')
      if ($shallow -eq 'true') {
        $fetchArguments += '--unshallow'
      }
      $fetchArguments += @('origin', '+refs/heads/main:refs/remotes/origin/main')
      & git @fetchArguments
      if ($LASTEXITCODE -ne 0) {
        Write-Host "##vso[task.logissue type=warning]Cannot fetch the affected-test main baseline; running the full test suite."
        exit 0
      }
      $baseline = & git -C $repository merge-base HEAD refs/remotes/origin/main
      if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($baseline)) {
        Write-Host "##vso[task.logissue type=warning]No common affected-test main baseline is available; running the full test suite."
        exit 0
      }
      Write-Host "Affected-test Git baseline: $($baseline.Trim())."
    }
    $binlogName = switch ($affectedTestsMode) {
      'collect' { 'TestCollect' }
      default { 'TestAffected' }
    }
    $testArguments = @(
      '--solution'
      '${{ parameters.solution }}'
      '-c'
      '$(_BuildConfig)'
      '--no-build'
      "-bl:$(Build.SourcesDirectory)/artifacts/TestResults/$(_BuildConfig)/$binlogName.binlog"
      '-p:UsingDotNetTest=true'
      '-p:TestingPlatformCaptureOutput=false'
    )
    if ('$(_WindowsBuildOutputTestArgs)' -eq '-p:UseAppHost=false') {
      $testArguments += '-p:UseAppHost=false'
    }

    if ($affectedTestsMode -eq 'collect') {
      $testArguments += @(
        '-p:TestingPlatformCommandLineArguments='
        '-p:TestRunnerAdditionalArguments='
      )
    }
    else {
      $testArguments += '-p:TestRunnerAdditionalArguments='
    }

    $testArguments += @('--show-test-results', 'failed')
    if ($affectedTestsMode -eq 'collect') {
      $testArguments += '--collect-test-map'
    }
    else {
      $testArguments += '--affected-tests'
    }

    & dotnet test @testArguments
    if ($affectedTestsMode -eq 'collect') {
      exit $LASTEXITCODE
    }

    $exitCode = $LASTEXITCODE
    if ($exitCode -eq 0) {
      Write-Host "##vso[task.setvariable variable=AffectedTestsSucceeded]true"
      exit 0
    }

    if ($exitCode -in 2, 8) {
      Write-Host "##vso[task.logissue type=error]Affected-test execution failed with exit code $exitCode."
      exit $exitCode
    }

    Write-Host "##vso[task.logissue type=warning]Affected-test selection failed; running the full test suite."
    exit 0
  ${{ if eq(parameters.affectedTestsMode, 'collect') }}:
    name: CollectAffectedTests
    displayName: Test and collect affected-test map
    condition: and(succeeded(), eq(variables._BuildConfig, 'Release'), ne(variables._XmlDocsOnly, 'true'), eq(variables._CollectAffectedTests, 'true'))
  ${{ else }}:
    name: TestAffected
    displayName: Test affected changes
    condition: and(succeeded(), eq(variables._BuildConfig, 'Release'), ne(variables._XmlDocsOnly, 'true'), eq(variables['Build.Reason'], 'PullRequest'))
  env:
    DOTNET_CLI_ENABLE_AFFECTED_TESTS: 1
    CTS_ACCESSTOKEN: $(System.AccessToken)
    CTS_COLLECTIONURI: $(System.CollectionUri)
    CTS_TEMPDIRECTORY: $(Agent.TempDirectory)
    CTS_BUILDID: $(Build.BuildId)
    BUILD_CONTAINERID: $(Build.ContainerId)
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
