parameters:
- name: SkipTests
  type: boolean
- name: EnableAffectedTests
  type: boolean

steps:
- template: /eng/pipelines/steps/install-windows-prereqs.yml

- task: PowerShell@2
  displayName: 'Enable local dumps'
  inputs:
    targetType: 'inline'
    script: |
      New-Item -Path $(Build.SourcesDirectory)\artifacts\CrashDumps -ItemType Directory -Force
      New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Force | Out-Null
      New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Name "DumpFolder" -Value "$(Build.SourcesDirectory)\artifacts\CrashDumps" -PropertyType ExpandString -Force
      New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Name "DumpCount" -Value 10 -PropertyType DWord -Force

- template: /eng/pipelines/steps/configure-azdo-live-test-publishing.yml
  parameters:
    enabled: false

- script: eng\common\CIBuild.cmd
    -configuration $(_BuildConfig)
    -prepareMachine
    /p:Publish=false
    /p:Test=false
    /p:FastAcceptanceTest=true
  name: Build
  displayName: Build

- ${{ if eq(parameters.SkipTests, False) }}:

  - template: /eng/pipelines/steps/test-windows-configuration-tests.yml
    parameters:
      enableAffectedTests: ${{ parameters.EnableAffectedTests }}
      ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
        affectedTestsMode: collect
      ${{ else }}:
        affectedTestsMode: run

  # artifacts/TestResults/$(_BuildConfig) only exists once a test step has written into it, and
  # PublishBuildArtifacts@1 hard-fails when PathtoPublish does not exist. A job that dies before the
  # tests run therefore reported one real problem as two failed steps, the way the official build did
  # in https://dev.azure.com/dnceng/internal/_build/results?buildId=3057151, where an Azure Artifacts
  # outage skipped Build and Test and this step then failed with "Not found PathtoPublish". Probe for
  # the folder so the publish skips when there is nothing to publish. When the tests did write results
  # they are published exactly as before, including on a failed run, which is why this uses always().
  - pwsh: |
      $testResults = Join-Path '$(Build.SourcesDirectory)' 'artifacts/TestResults/$(_BuildConfig)'
      $hasTestResults = 'false'
      if (Test-Path -LiteralPath $testResults -PathType Container) { $hasTestResults = 'true' }
      Write-Host "Test results under '$testResults': $hasTestResults"
      Write-Host "##vso[task.setvariable variable=HasTestResults]$hasTestResults"
    displayName: 'Check for Test Results folders'
    condition: always()

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Test Results folders'
    inputs:
      PathtoPublish: '$(Build.SourcesDirectory)/artifacts/TestResults/$(_BuildConfig)'
      ArtifactName: TestResults_Windows_$(_TestArtifactsName)_Attempt$(System.JobAttempt)
    condition: and(always(), ne(variables._XmlDocsOnly, 'true'), eq(variables.HasTestResults, 'true'))

  # The integration suite only creates artifacts/tmp/$(_BuildConfig)/testsuite once it runs, and
  # CopyFiles@2 hard-fails when SourceFolder does not exist. A Test failure early enough to skip the
  # suite therefore reported one real problem as three failed steps: Test, Copy binlogs, and Publish
  # integration tests binlogs all failed in
  # https://dev.azure.com/dnceng/internal/_build/results?buildId=3045544. Probe for the binlogs so
  # both steps skip when there are none. When the suite did produce binlogs they are copied and
  # published exactly as before, including on a failed run, which is why these use always().
  - pwsh: |
      $testsuite = Join-Path '$(Build.SourcesDirectory)' 'artifacts/tmp/$(_BuildConfig)/testsuite'
      $hasBinlogs = 'false'
      if (Test-Path -LiteralPath $testsuite -PathType Container) {
        $binlog = Get-ChildItem -LiteralPath $testsuite -Filter '*.binlog' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($null -ne $binlog) { $hasBinlogs = 'true' }
      }
      Write-Host "Integration tests binlogs under '$testsuite': $hasBinlogs"
      Write-Host "##vso[task.setvariable variable=HasIntegrationTestBinlogs]$hasBinlogs"
    displayName: 'Check for integration tests binlogs'
    condition: and(always(), eq(variables._BuildConfig, 'Release'))

  - task: CopyFiles@2
    displayName: 'Copy binlogs'
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)/artifacts/tmp/$(_BuildConfig)/testsuite'
      Contents: |
        **/*.binlog
      TargetFolder: '$(Build.ArtifactStagingDirectory)/binlogs'
    condition: and(always(), eq(variables._BuildConfig, 'Release'), eq(variables.HasIntegrationTestBinlogs, 'true'))

  - task: PublishBuildArtifacts@1
    displayName: 'Publish integration tests binlogs'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/binlogs'
      ArtifactName: Integration_Tests_Windows_Binlogs_$(_TestArtifactsName)
    condition: and(always(), eq(variables._BuildConfig, 'Release'), eq(variables.HasIntegrationTestBinlogs, 'true'))

  # "Enable local dumps" creates artifacts/CrashDumps before the build, but an earlier failure can skip
  # that setup step. PublishBuildArtifacts@1 then hard-fails because PathtoPublish does not exist, adding
  # another red step on top of the real failure. Probe for the folder so the publish skips when the setup
  # step did not create it. The probe runs on every outcome so the variable is set whichever way the job
  # goes; the publish still only runs on a failed run and publishes the folder exactly as before.
  - pwsh: |
      $crashDumps = Join-Path '$(Build.SourcesDirectory)' 'artifacts/CrashDumps'
      $hasCrashDumps = 'false'
      if (Test-Path -LiteralPath $crashDumps -PathType Container) { $hasCrashDumps = 'true' }
      Write-Host "Crash dumps under '$crashDumps': $hasCrashDumps"
      Write-Host "##vso[task.setvariable variable=HasCrashDumps]$hasCrashDumps"
    displayName: 'Check for local dumps'
    condition: always()

  - task: PublishBuildArtifacts@1
    displayName: 'Publish local dumps'
    inputs:
      PathtoPublish: '$(Build.SourcesDirectory)/artifacts/CrashDumps'
      ArtifactName: TestResults_Windows_$(_TestArtifactsName)
    condition: and(failed(), eq(variables.HasCrashDumps, 'true'))
