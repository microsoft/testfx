steps:
- checkout: self
  fetchDepth: 1
  clean: true
  persistCredentials: false

- task: PowerShell@2
  displayName: Build and verify the composed browser product
  inputs:
    pwsh: true
    targetType: inline
    script: |
      $ErrorActionPreference = 'Stop'
      $pin = Get-Content -LiteralPath '$(Build.SourcesDirectory)/eng/browser-testing/sdk.json' -Raw | ConvertFrom-Json
      if ($pin.repository -ne 'dotnet/sdk' -or $pin.commit -notmatch '^[0-9a-f]{40}$') {
        throw 'The browser validation SDK counterpart must be pinned to a full dotnet/sdk SHA.'
      }

      $browser = '$(browserExecutable)'
      if (-not (Test-Path -LiteralPath $browser -PathType Leaf)) {
        throw "The required Chromium-family browser is not installed at '$browser'."
      }

      $sdkRoot = Join-Path '$(Agent.TempDirectory)' "browser-sdk-$($pin.commit)"
      if (Test-Path -LiteralPath $sdkRoot) {
        throw "The clean SDK checkout path already exists: '$sdkRoot'."
      }

      git init --quiet $sdkRoot
      if ($LASTEXITCODE -ne 0) { throw 'Unable to initialize the SDK checkout.' }
      git -C $sdkRoot remote add origin "https://github.com/$($pin.repository).git"
      if ($LASTEXITCODE -ne 0) { throw 'Unable to configure the SDK checkout.' }
      git -C $sdkRoot fetch --depth 1 origin $pin.commit
      if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch the pinned SDK commit.' }
      git -C $sdkRoot checkout --quiet --detach FETCH_HEAD
      if ($LASTEXITCODE -ne 0) { throw 'Unable to check out the pinned SDK commit.' }
      $actualCommit = (git -C $sdkRoot rev-parse HEAD).Trim()
      if ($LASTEXITCODE -ne 0 -or $actualCommit -ne $pin.commit) {
        throw "The SDK checkout '$actualCommit' does not match the pin '$($pin.commit)'."
      }

      & (Join-Path $sdkRoot 'eng/browser-testing/TestResultValidation.ps1')
      if ($LASTEXITCODE -ne 0) { throw 'The SDK browser-result validator self-tests failed.' }
      & (Join-Path $sdkRoot 'eng/browser-testing/RunBrowserTests.ps1') `
        -SdkRoot $sdkRoot `
        -TestFxRoot '$(Build.SourcesDirectory)' `
        -BrowserExecutable $browser `
        -Configuration Release `
        -ResultsDirectory '$(BrowserResultsDirectory)'
      if ($LASTEXITCODE -ne 0) { throw 'The composed browser validation failed.' }

- task: PublishTestResults@2
  displayName: Publish mandatory browser acceptance results
  condition: always()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(BrowserResultsDirectory)/test-results/browser.trx'
    testRunTitle: 'Browser WebAssembly ($(image))'
    failTaskOnFailedTests: true
    failTaskOnMissingResultsFile: true

- pwsh: |
    $hasEvidence = Test-Path -LiteralPath '$(BrowserResultsDirectory)' -PathType Container
    Write-Host "Browser evidence under '$(BrowserResultsDirectory)': $hasEvidence"
    Write-Host "##vso[task.setvariable variable=HasBrowserEvidence]$($hasEvidence.ToString().ToLowerInvariant())"
  displayName: Check for composed browser evidence
  condition: always()

- task: CopyFiles@2
  displayName: Collect composed browser diagnostics
  condition: and(always(), eq(variables.HasBrowserEvidence, 'true'))
  inputs:
    SourceFolder: '$(BrowserResultsDirectory)'
    Contents: |
      **/*.log
      **/*.json
      **/*.trx
      **/*.binlog
    TargetFolder: '$(Build.ArtifactStagingDirectory)/browser-ci'

- task: PublishPipelineArtifact@1
  displayName: Publish composed browser diagnostics
  condition: and(always(), eq(variables.HasBrowserEvidence, 'true'))
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/browser-ci'
    artifact: 'Browser_$(image)_Attempt$(System.JobAttempt)'
