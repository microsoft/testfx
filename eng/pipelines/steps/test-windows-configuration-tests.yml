# Windows Release full-test and coverage steps plus Debug unit tests, shared by PR and main-branch validation.
#
# Assumes the consuming job declares:
#   - the matrix variable `_BuildConfig` (Debug or Release)
#   - the job-level environment variables from eng/pipelines/variables/test-env-vars.yml
parameters:
- name: enableAffectedTests
  type: boolean
  default: false
- name: affectedTestsMode
  type: string
  default: disabled
  values:
  - disabled
  - collect
  - run

steps:
# Because the build step is using -ci, restore is done in a local .packages directory.
# NUGET_PACKAGES must point to that directory so test project evaluation imports the restored package props/targets.
#
# -p:TestingPlatformCaptureOutput=false streams each test executable's output to the AzDO console instead of
# buffering it until failure, preserving live progress during long-running test sessions.
- ${{ if eq(parameters.enableAffectedTests, false) }}:
  - script: |
      echo ##vso[task.setvariable variable=PublishCoverageReport]true
      dotnet test --solution TestFx.slnx -c $(_BuildConfig) --no-build -bl:$(BUILD.SOURCESDIRECTORY)\artifacts\TestResults\$(_BuildConfig)\TestStep.binlog -p:UsingDotNetTest=true -p:TestingPlatformCaptureOutput=false --show-test-results failed
    name: Test
    displayName: Test
    condition: and(succeeded(), eq(variables._BuildConfig, 'Release'), ne(variables._XmlDocsOnly, 'true'))
    env:
      # Secret variables are not automatically exposed to scripts. Fork PR builds do not receive this token,
      # so report-azdo history queries no-op there; trusted branch builds exercise them end-to-end.
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

# These branches implement affected-test collection and selection. The SDK owns
# DOTNET_CLI_TEST_AFFECTED_TESTS_MODE; pipelines must not set it.
- ${{ if and(eq(parameters.enableAffectedTests, true), eq(parameters.affectedTestsMode, 'collect')) }}:
  - pwsh: |
      $sdkVersion = dotnet --version
      & dotnet test --solution TestFx.slnx -c $(_BuildConfig) --no-build -bl:$(BUILD.SOURCESDIRECTORY)\artifacts\TestResults\$(_BuildConfig)\TestCollect.binlog -p:UsingDotNetTest=true -p:TestingPlatformCaptureOutput=false -p:TestingPlatformCommandLineArguments= -p:TestRunnerAdditionalArguments= --show-test-results failed --collect-test-map 2>&1 |
        Tee-Object -Variable collectOutput
      $exitCode = $LASTEXITCODE

      if ($exitCode -eq 0) {
        exit 0
      }

      $outputText = [regex]::Replace(
        $collectOutput -join [Environment]::NewLine,
        "$([char]0x1B)\[[0-?]*[ -/]*[@-~]",
        '')
      $handshakeSectionIndex = $outputText.LastIndexOf('Handshake failures:', [System.StringComparison]::Ordinal)
      $allHandshakeFailuresAreSuccessfulMapCollections = $handshakeSectionIndex -ge 0
      if ($allHandshakeFailuresAreSuccessfulMapCollections) {
        $executionOutput = $outputText.Substring(0, $handshakeSectionIndex)
        $handshakeOutput = $outputText.Substring($handshakeSectionIndex)
        $childResults = @{}
        $executionExitCodes = [regex]::Matches(
          $executionOutput,
          '(?m)^Exit code: (?<exitCode>-?\d+)\s*$')
        $allExecutionChildrenSucceeded = $executionExitCodes.Count -gt 0
        foreach ($executionExitCode in $executionExitCodes) {
          $allExecutionChildrenSucceeded =
            $allExecutionChildrenSucceeded -and
            [int]$executionExitCode.Groups['exitCode'].Value -eq 0
        }

        $segmentStart = 0
        foreach ($childSummary in [regex]::Matches(
          $executionOutput,
          '(?m)^(?<module>.+?) Zero tests ran\r?\nExit code: (?<exitCode>-?\d+)\s*$')) {
          $segment = $executionOutput.Substring($segmentStart, $childSummary.Index - $segmentStart)
          $childExitCode = [int]$childSummary.Groups['exitCode'].Value
          $childResults[$childSummary.Groups['module'].Value] = @{
            ExitCode = $childExitCode
            PersistedMap = $segment.Contains('[affected-tests] Collected test map')
          }
          $segmentStart = $childSummary.Index + $childSummary.Length
        }

        $handshakeFailures = [regex]::Matches(
          $handshakeOutput,
          '(?m)^\s{2}(?<module>.+?)\r?\nExit code: (?<exitCode>-?\d+)\s*$')
        $allHandshakeFailuresAreSuccessfulMapCollections =
          $handshakeFailures.Count -gt 0 -and
          $allExecutionChildrenSucceeded
        foreach ($handshakeFailure in $handshakeFailures) {
          $module = $handshakeFailure.Groups['module'].Value
          $allHandshakeFailuresAreSuccessfulMapCollections =
            $allHandshakeFailuresAreSuccessfulMapCollections -and
            [int]$handshakeFailure.Groups['exitCode'].Value -eq 0 -and
            $childResults.ContainsKey($module) -and
            $childResults[$module].ExitCode -eq 0 -and
            $childResults[$module].PersistedMap
        }
      }

      $isKnownSdkHandshakeFailure =
        $sdkVersion -eq '12.0.100-alpha.1.26480.103' -and
        $exitCode -eq 1 -and
        $outputText.Contains('Test run completed with non-success exit code: 1') -and
        $allHandshakeFailuresAreSuccessfulMapCollections

      if ($isKnownSdkHandshakeFailure) {
        Write-Host "##vso[task.logissue type=warning]SDK $sdkVersion misclassified exit-zero affected-test collection modules after their maps were persisted; continuing to the authoritative full test run."
        exit 0
      }

      exit $exitCode
    name: CollectAffectedTests
    displayName: Test and collect affected-test map
    condition: and(succeeded(), eq(variables._BuildConfig, 'Release'), ne(variables._XmlDocsOnly, 'true'))
    env:
      DOTNET_CLI_ENABLE_AFFECTED_TESTS: 1
      CTS_ACCESSTOKEN: $(System.AccessToken)
      CTS_COLLECTIONURI: $(System.CollectionUri)
      CTS_TEMPDIRECTORY: $(Agent.TempDirectory)
      CTS_BUILDID: $(Build.BuildId)
      BUILD_CONTAINERID: $(Build.ContainerId)
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  # Map collection owns code-coverage instrumentation and launches discovery children with --list-tests, so
  # ordinary coverage and report options cannot participate in that invocation. Keep the normal Release run
  # separate to retain test reporting and the repository's required coverage publication.
  - script: |
      echo ##vso[task.setvariable variable=PublishCoverageReport]true
      dotnet test --solution TestFx.slnx -c $(_BuildConfig) --no-build -bl:$(BUILD.SOURCESDIRECTORY)\artifacts\TestResults\$(_BuildConfig)\TestStep.binlog -p:UsingDotNetTest=true -p:TestingPlatformCaptureOutput=false --show-test-results failed
    name: Test
    displayName: Test
    condition: and(succeeded(), eq(variables._BuildConfig, 'Release'), ne(variables._XmlDocsOnly, 'true'))
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- ${{ if and(eq(parameters.enableAffectedTests, true), eq(parameters.affectedTestsMode, 'run')) }}:
  - pwsh: |
      dotnet test --solution TestFx.slnx -c $(_BuildConfig) --no-build -bl:$(BUILD.SOURCESDIRECTORY)\artifacts\TestResults\$(_BuildConfig)\TestAffected.binlog -p:UsingDotNetTest=true -p:TestingPlatformCaptureOutput=false -p:TestRunnerAdditionalArguments= --show-test-results failed --affected-tests
      $exitCode = $LASTEXITCODE
      if ($exitCode -eq 0) {
        Write-Host "##vso[task.setvariable variable=AffectedTestsSucceeded]true"
        exit 0
      }

      if ($exitCode -in 2, 8) {
        Write-Host "##vso[task.logissue type=error]Affected-test execution failed with exit code $exitCode."
        exit $exitCode
      }

      Write-Host "##vso[task.logissue type=warning]Affected-test selection failed; running the full test suite."
      exit 0
    name: TestAffected
    displayName: Test affected changes
    condition: and(succeeded(), eq(variables._BuildConfig, 'Release'), ne(variables._XmlDocsOnly, 'true'), eq(variables['Build.Reason'], 'PullRequest'))
    env:
      DOTNET_CLI_ENABLE_AFFECTED_TESTS: 1
      CTS_ACCESSTOKEN: $(System.AccessToken)
      CTS_COLLECTIONURI: $(System.CollectionUri)
      CTS_TEMPDIRECTORY: $(Agent.TempDirectory)
      CTS_BUILDID: $(Build.BuildId)
      BUILD_CONTAINERID: $(Build.ContainerId)
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  # Scheduled and manual runs keep their full-validation contract. PRs use this explicit fallback only when the
  # affected-test command fails; missing, stale, incompatible, or inaccessible maps are handled inside the extension
  # by running all tests.
  - pwsh: |
      Write-Host "##vso[task.setvariable variable=PublishCoverageReport]true"

      $testResultsDirectory = "$(Build.SourcesDirectory)\artifacts\TestResults\$(_BuildConfig)"
      if (Test-Path $testResultsDirectory) {
        Get-ChildItem $testResultsDirectory -Filter *.coverage -File -ErrorAction SilentlyContinue |
          Remove-Item -Force
      }

      dotnet test --solution TestFx.slnx -c $(_BuildConfig) --no-build -bl:$(BUILD.SOURCESDIRECTORY)\artifacts\TestResults\$(_BuildConfig)\TestFallback.binlog -p:UsingDotNetTest=true -p:TestingPlatformCaptureOutput=false --show-test-results failed
      exit $LASTEXITCODE
    name: Test
    displayName: Test (affected-test fallback)
    condition: and(succeeded(), eq(variables._BuildConfig, 'Release'), ne(variables._XmlDocsOnly, 'true'), or(ne(variables['Build.Reason'], 'PullRequest'), ne(variables['AffectedTestsSucceeded'], 'true')))
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- ${{ if and(eq(parameters.enableAffectedTests, true), eq(parameters.affectedTestsMode, 'disabled')) }}:
  - pwsh: throw "affectedTestsMode must be 'collect' or 'run' when enableAffectedTests is true."
    displayName: Reject invalid affected-test configuration

# The Debug leg exists to exercise DEBUG-conditional product code and tests. The Release integration suite
# already creates child test assets in both configurations, so repeating that suite in Debug is redundant.
# --test-modules bypasses MSBuild evaluation, so explicitly provide the reporting and diagnostics arguments.
- script: dotnet test --no-build --test-modules "artifacts/bin/*UnitTests*/$(_BuildConfig)/**/*UnitTests.exe" --results-directory $(BUILD.SOURCESDIRECTORY)\artifacts\TestResults\$(_BuildConfig) $(_DebugUnitTestReportArgs) $(AZDO_LIVE_PUBLISHING_ARGS) --diagnostic --diagnostic-output-directory $(BUILD.SOURCESDIRECTORY)\artifacts\log\$(_BuildConfig) --diagnostic-verbosity trace --show-test-results failed
  name: TestDebug
  displayName: Test (unit tests only)
  condition: and(succeeded(), eq(variables._BuildConfig, 'Debug'), ne(variables._XmlDocsOnly, 'true'))
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- template: /eng/pipelines/steps/finalize-azdo-live-test-publishing.yml

- task: PublishTestResults@2
  displayName: Publish TRX Test Results (fallback)
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '*.trx'
    searchFolder: '$(System.DefaultWorkingDirectory)/artifacts/TestResults/$(_BuildConfig)'
    testRunTitle: '$(System.JobName)-trx'
  continueOnError: true
  condition: and(always(), ne(variables._XmlDocsOnly, 'true'), ne(variables.TESTFX_AZDO_LIVE_PUBLISHING_SUCCEEDED, 'true'))

# Publish a portable, compact report separately from the large TestResults artifact so external consumers can
# retrieve it without downloading every test result and binary .coverage file.
- task: PowerShell@2
  displayName: 'Merge coverage as Cobertura'
  inputs:
    targetType: 'inline'
    script: |
      dotnet tool restore
      if ($LASTEXITCODE -ne 0) {
        exit $LASTEXITCODE
      }

      $testResultsDirectory = "$(Build.SourcesDirectory)\artifacts\TestResults\$(_BuildConfig)"
      $coverageFiles = @()
      if (Test-Path $testResultsDirectory) {
        $coverageFiles = @(Get-ChildItem $testResultsDirectory -Filter *.coverage -File)
      }
      if ($coverageFiles.Count -eq 0) {
        Write-Host "##vso[task.logissue type=error]No coverage files were produced; every Windows Release run must publish coverage."
        exit 1
      }

      $coverageOutputDirectory = "$(Build.ArtifactStagingDirectory)\coverage"
      New-Item -Path $coverageOutputDirectory -ItemType Directory -Force | Out-Null

      $mergeArguments = @("coverage", "merge") + $coverageFiles.FullName + @("--output", "$coverageOutputDirectory\coverage.cobertura.xml", "--output-format", "cobertura")
      & dotnet @mergeArguments
      if ($LASTEXITCODE -ne 0) {
        exit $LASTEXITCODE
      }

      Write-Host "##vso[task.setvariable variable=CoverageReportReady]true"
  condition: and(succeededOrFailed(), eq(variables._BuildConfig, 'Release'), eq(variables['PublishCoverageReport'], 'true'))

- task: PublishBuildArtifacts@1
  displayName: 'Publish Cobertura coverage report'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/coverage'
    ArtifactName: Coverage_Windows_Release_Attempt$(System.JobAttempt)
  condition: and(succeededOrFailed(), eq(variables['CoverageReportReady'], 'true'))

# Use the merged Cobertura report for the Azure DevOps Code Coverage tab and summary. This is the same portable
# report saved above, avoiding a second merge of the binary .coverage inputs inside the publishing task.
- task: PublishCodeCoverageResults@2
  displayName: 'Publish coverage to Azure DevOps'
  inputs:
    summaryFileLocation: '$(Build.ArtifactStagingDirectory)/coverage/coverage.cobertura.xml'
    pathToSources: '$(Build.SourcesDirectory)/src'
  condition: and(succeededOrFailed(), eq(variables['CoverageReportReady'], 'true'))
