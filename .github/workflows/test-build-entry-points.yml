name: Test Windows build entry points

on:
  pull_request:
    paths:
      - 'Build.cmd'
      - 'eng/build.ps1'
      - '.github/workflows/tests/test_build_entry_points.py'
      - '.github/workflows/test-build-entry-points.yml'
  push:
    branches:
      - rel/4.5
    paths:
      - 'Build.cmd'
      - 'eng/build.ps1'
      - '.github/workflows/tests/test_build_entry_points.py'
      - '.github/workflows/test-build-entry-points.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-entry-points-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-entry-points:
    name: Test Windows build entry points
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test build entry point exit codes
        run: python .github\workflows\tests\test_build_entry_points.py -v
