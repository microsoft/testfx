name: Perf timing nightly

# Performance collection and non-blocking regression detection for
# microsoft/testfx#9312 and microsoft/testfx#10549. Runs on both Windows and
# Linux, but uses Linux results for the rolling baseline because hosted Linux
# runners tend to have more consistent timing. Allocation microbenchmarks are
# collected on Linux without gating pull requests.

on:
  schedule:
    # Nightly at 06:00 UTC, avoiding existing scheduled workflow slots.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: perf-timing-nightly
  cancel-in-progress: false

jobs:
  collect-windows:
    name: Collect PlainProcess timing (Windows)
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build packages
        shell: pwsh
        run: .\build.cmd -pack -c Release

      - name: Run PlainProcess timing pipeline
        shell: pwsh
        env:
          MSTEST_PERFORMANCE_SKIP_ARCHIVE: '1'
          Microsoft_Testing_TestInfrastructure_TempDirectory_Cleanup: '0'
        run: |
          $startTime = (Get-Date).ToUniversalTime().AddMinutes(-5).ToString("O")
          "PERF_TIMING_STARTED=$startTime" >> $env:GITHUB_ENV
          & "$env:GITHUB_WORKSPACE\.dotnet\dotnet.exe" run --project test\Performance\MSTest.Performance.Runner -c Release -- execute --pipelineNameFilter "*PlainProcess*"

      - name: Stage Result.json files
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stagingDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts\perf-results"
          New-Item -ItemType Directory -Path $stagingDirectory -Force | Out-Null

          $startTime = [DateTimeOffset]::Parse($env:PERF_TIMING_STARTED).UtcDateTime
          $resultRoot = Join-Path $env:GITHUB_WORKSPACE "Results"
          $results = @(
            Get-ChildItem -Path $resultRoot -Filter Result.json -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTimeUtc -ge $startTime }
          )

          if ($results.Count -eq 0) {
            Write-Host "::error::No Result.json files were found under '$resultRoot' after the PlainProcess run."
            exit 1
          }

          for ($i = 0; $i -lt $results.Count; $i++) {
            $destinationDirectory = Join-Path $stagingDirectory ("result-{0:D3}" -f ($i + 1))
            New-Item -ItemType Directory -Path $destinationDirectory -Force | Out-Null
            Copy-Item -Path $results[$i].FullName -Destination (Join-Path $destinationDirectory "Result.json") -Force
            Write-Host "Staged '$($results[$i].FullName)'"
          }

      - name: Upload Result.json
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-timing-result-json-windows
          path: artifacts\perf-results\
          if-no-files-found: error
          retention-days: 90

  collect-linux:
    name: Collect PlainProcess timing (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build packages
        run: ./build.sh -pack -c Release

      - name: Mark timing start
        run: touch "$RUNNER_TEMP/perf_timing_start"

      - name: Install NativeAOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev

      - name: Run PlainProcess timing pipeline
        env:
          MSTEST_PERFORMANCE_SKIP_ARCHIVE: '1'
          Microsoft_Testing_TestInfrastructure_TempDirectory_Cleanup: '0'
        run: |
          "$GITHUB_WORKSPACE/.dotnet/dotnet" run --project test/Performance/MSTest.Performance.Runner -c Release -- execute --pipelineNameFilter "*PlainProcess*"

      - name: Stage Result.json files
        if: ${{ always() }}
        run: |
          set -euo pipefail
          STAGING_DIR="$GITHUB_WORKSPACE/artifacts/perf-results"
          mkdir -p "$STAGING_DIR"

          RESULT_ROOT="$GITHUB_WORKSPACE/Results"
          mapfile -d '' -t RESULTS < <(find "$RESULT_ROOT" -name "Result.json" -type f -newer "$RUNNER_TEMP/perf_timing_start" -print0 2>/dev/null)

          if [ "${#RESULTS[@]}" -eq 0 ]; then
            echo "::error::No Result.json files were found under '$RESULT_ROOT' after the PlainProcess run."
            exit 1
          fi

          for i in "${!RESULTS[@]}"; do
            IDX=$(( i + 1 ))
            DEST_DIR="$STAGING_DIR/result-$(printf '%03d' "$IDX")"
            mkdir -p "$DEST_DIR"
            cp "${RESULTS[$i]}" "$DEST_DIR/Result.json"
            echo "Staged '${RESULTS[$i]}'"
          done

      - name: Upload Result.json
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-timing-result-json-linux
          path: artifacts/perf-results/
          if-no-files-found: error
          retention-days: 90

      - name: Download previous rolling baseline
        id: previous-baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASELINE_ZIP: ${{ runner.temp }}/perf-baseline.zip
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repository = await github.rest.repos.get({ owner, repo });
            const workflowRuns = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'perf-timing-nightly.yml',
              status: 'completed',
              branch: repository.data.default_branch,
              per_page: 100,
            });

            for (const run of workflowRuns.data.workflow_runs) {
              if (run.id === context.runId) {
                continue;
              }

              const workflowArtifacts =
                await github.rest.actions.listWorkflowRunArtifacts({
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100,
                });
              const baseline = workflowArtifacts.data.artifacts.find(
                artifact => artifact.name === 'perf-timing-baseline-linux' && !artifact.expired);
              if (!baseline) {
                continue;
              }

              const download = await github.rest.actions.downloadArtifact({
                owner,
                repo,
                artifact_id: baseline.id,
                archive_format: 'zip',
              });
              fs.writeFileSync(process.env.BASELINE_ZIP, Buffer.from(download.data));
              core.info(`Using baseline artifact ${baseline.id} from run ${run.id}.`);
              core.setOutput('found', 'true');
              return;
            }

            core.info('No previous rolling baseline was found; this run will initialize it.');
            core.setOutput('found', 'false');

      - name: Extract previous rolling baseline
        if: steps.previous-baseline.outputs.found == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/perf-baseline"
          unzip -q "$RUNNER_TEMP/perf-baseline.zip" -d "$RUNNER_TEMP/perf-baseline"

      - name: Compare with rolling baseline
        run: |
          python .github/scripts/compare_perf_timings.py \
            --current-dir artifacts/perf-results \
            --baseline "$RUNNER_TEMP/perf-baseline/Baseline.json" \
            --output artifacts/perf-baseline/Baseline.json \
            --summary artifacts/perf-baseline/Summary.md \
            --run-id "$GITHUB_RUN_ID"
          cat artifacts/perf-baseline/Summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rolling baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-timing-baseline-linux
          path: artifacts/perf-baseline/

      - name: Run allocation microbenchmarks
        if: ${{ always() }}
        run: |
          "$GITHUB_WORKSPACE/.dotnet/dotnet" run \
            --project test/Performance/MSTest.Performance.Benchmarks \
            -c Release -- \
            --filter "*" \
            --buildTimeout 600 \
            --generateBinLog \
            --artifacts "$GITHUB_WORKSPACE/artifacts/perf-microbenchmarks"

      - name: Upload allocation microbenchmarks
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-microbenchmarks-linux
          path: artifacts/perf-microbenchmarks/
          if-no-files-found: error
          retention-days: 90
