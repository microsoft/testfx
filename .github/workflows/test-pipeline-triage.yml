name: Test pipeline triage helper

on:
  pull_request:
    paths:
      - '.github/scripts/pipeline_test_triage.py'
      - '.github/scripts/test_pipeline_test_triage.py'
      - '.github/workflows/test-pipeline-triage.yml'
  push:
    branches:
      - main
      - 'rel/*'
    paths:
      - '.github/scripts/pipeline_test_triage.py'
      - '.github/scripts/test_pipeline_test_triage.py'
      - '.github/workflows/test-pipeline-triage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test pipeline triage helper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python .github/scripts/test_pipeline_test_triage.py
