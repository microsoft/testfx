name: Test pipeline triage helper

on:
  pull_request:
    paths:
      - '.github/scripts/pipeline_test_triage.py'
      - '.github/scripts/test_pipeline_test_triage.py'
      - '.github/workflows/test-pipeline-triage.yml'
  push:
    branches:
      - main
      - 'rel/*'
    paths:
      - '.github/scripts/pipeline_test_triage.py'
      - '.github/scripts/test_pipeline_test_triage.py'
      - '.github/workflows/test-pipeline-triage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test pipeline triage helper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python .github/scripts/test_pipeline_test_triage.py
