name: Markdownlint

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint*.json*"
      - ".markdownlintignore"
      - ".github/workflows/markdownlint.yml"

concurrency:
  group: markdownlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Run the CLI directly rather than DavidAnson/markdownlint-cli2-action. The microsoft
    # organization's allowed-actions list only permits that action at @v18, so every other
    # version is rejected before a job is created and the run ends in startup_failure with
    # no logs and no check run. A `run:` step is not subject to the allow-list, so the gate
    # can no longer be silently disabled by a version bump.
    - name: Run markdownlint-cli2
      run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"
