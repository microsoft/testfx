name: Check action pins

# Guards the generated agentic-workflow lock files (and every hand-authored
# workflow) against unpinned or drifted `uses:` references.
#
# A locally-built `gh aw` extension can silently rewrite security-relevant pins
# when it regenerates a `*.lock.yml` — downgrading `actions/checkout` or
# un-pinning `github/gh-aw-actions/setup` to a mutable tag — because
# `.github/aw/actions-lock.json` keys its overrides by version string and
# framework-injected steps request versions the ledger does not carry. The
# corruption lands in generated files reviewers rarely read line-by-line, so it
# needs a machine gate. See https://github.com/microsoft/testfx/issues/10258.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/aw/actions-lock.json'
      - '.github/scripts/check_action_pins.py'
      - '.github/scripts/check-action-pins-requirements.txt'
  push:
    branches:
      - main
      - 'rel/*'
    paths:
      - '.github/workflows/**'
      - '.github/aw/actions-lock.json'
      - '.github/scripts/check_action_pins.py'
      - '.github/scripts/check-action-pins-requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-action-pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verify workflow action pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/scripts/check-action-pins-requirements.txt
      - name: Check action pins
        run: python .github/scripts/check_action_pins.py
