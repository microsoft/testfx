name: Assign issue area owner

on:
  issues:
    types: [labeled, unlabeled]

permissions:
  contents: none
  issues: write

concurrency:
  group: assign-issue-area-owner-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  assign:
    if: contains(fromJSON('["external/test-explorer","external/fakes","external/code-coverage"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - name: Assign owner from exact labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labelOwners = new Map([
              ["external/test-explorer", "drognanar"],
              ["external/fakes", "drognanar"],
              ["external/code-coverage", "fhnaseer"],
            ]);
            const mappedOwners = new Set(labelOwners.values());

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            const matchingOwners = new Set(
              issue.labels
                .map(label => typeof label === "string" ? label : label.name)
                .filter(label => labelOwners.has(label))
                .map(label => labelOwners.get(label)),
            );

            const events = await github.paginate(github.rest.issues.listEventsForTimeline, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const assignmentActors = new Map();
            for (const event of events) {
              const assignee = event.assignee?.login;
              if (!mappedOwners.has(assignee)) {
                continue;
              }

              if (event.event === "assigned") {
                assignmentActors.set(assignee, event.actor?.login);
              } else if (event.event === "unassigned") {
                assignmentActors.delete(assignee);
              }
            }

            const currentAssignees = new Set(
              (issue.assignees ?? []).map(existingAssignee => existingAssignee.login),
            );
            const automatedMappedAssignees = [...currentAssignees].filter(
              assignee => mappedOwners.has(assignee)
                && assignmentActors.get(assignee) === "github-actions[bot]",
            );
            const [desiredAssignee] = matchingOwners.size === 1 ? matchingOwners : [];
            const assigneesToRemove = automatedMappedAssignees.filter(
              assignee => assignee !== desiredAssignee,
            );

            if (assigneesToRemove.length > 0) {
              await github.rest.issues.removeAssignees({
                owner,
                repo,
                issue_number,
                assignees: assigneesToRemove,
              });
            }

            if (desiredAssignee && !currentAssignees.has(desiredAssignee)) {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number,
                assignees: [desiredAssignee],
              });
            }
