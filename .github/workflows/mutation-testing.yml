name: Mutation testing

on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-testing
  cancel-in-progress: false

jobs:
  discover-projects:
    name: Discover production projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: projects
        name: Read mutation solution
        shell: pwsh
        run: |
          [xml]$solution = Get-Content MutationTesting.slnx -Raw
          $projects = @(
            $solution.Solution.Folder.Project |
              ForEach-Object Path |
              Where-Object { $_ -like 'src/*' } |
              ForEach-Object { [System.IO.Path]::GetFileNameWithoutExtension($_) }
          )
          "projects=$($projects | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT

  stryker:
    name: ${{ matrix.project }}
    needs: discover-projects
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.project == 'TestFramework' && 240 || 90 }}
    continue-on-error: true

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project: ${{ fromJson(needs.discover-projects.outputs.projects) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build repository
        run: ./build.sh --binaryLog

      - name: Restore Stryker.NET
        run: ./.dotnet/dotnet tool restore --tool-manifest .config/stryker/dotnet-tools.json --configfile .config/stryker/NuGet.config

      - name: Run mutation tests
        env:
          CONCURRENCY: ${{ matrix.project == 'TestFramework' && '1' || '2' }}
          PROJECT: ${{ matrix.project }}
        run: |
          set -o pipefail
          output="$GITHUB_WORKSPACE/artifacts/mutation-testing/$PROJECT"
          mkdir -p "$output"
          pwsh .config/stryker/run.ps1 -Project "$PROJECT" -Output "$output" -Concurrency "$CONCURRENCY" 2>&1 |
            tee "$output/stryker-console.log"

      - name: Summarize mutation testing results
        if: ${{ always() }}
        env:
          PROJECT: ${{ matrix.project }}
        shell: pwsh
        run: |
          $report = "artifacts/mutation-testing/$env:PROJECT/reports/mutation-report.json"
          "## $env:PROJECT" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY

          if (-not (Test-Path $report)) {
            "Stryker did not produce a JSON report. See the uploaded console log." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $json = Get-Content $report -Raw | ConvertFrom-Json
          $counts = @{}
          foreach ($file in $json.files.PSObject.Properties) {
            foreach ($mutant in $file.Value.mutants) {
              $counts[$mutant.status] = 1 + ($counts[$mutant.status] ?? 0)
            }
          }

          $detected = $counts.Killed + $counts.Timeout
          $valid = $detected + $counts.Survived + $counts.NoCoverage
          $score = if ($valid -eq 0) { 0 } else { 100 * $detected / $valid }
          "| Score | Killed | Survived | No coverage | Timeout | Runtime error | Compile error | Ignored |" >> $env:GITHUB_STEP_SUMMARY
          "| ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |" >> $env:GITHUB_STEP_SUMMARY
          "| $($score.ToString('0.00'))% | $($counts.Killed) | $($counts.Survived) | $($counts.NoCoverage) | $($counts.Timeout) | $($counts.RuntimeError) | $($counts.CompileError) | $($counts.Ignored) |" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-testing-${{ matrix.project }}
          path: artifacts/mutation-testing/${{ matrix.project }}/
          if-no-files-found: warn
          retention-days: 30
