name: Mutation testing

on:
  schedule:
    # Runs daily so the mutation-test-improver workflow has fresh data to act on.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-testing
  cancel-in-progress: false

jobs:
  stryker:
    name: Run Stryker.NET
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build repository
        run: ./build.sh --binaryLog

      - name: Restore local tools
        run: ./.dotnet/dotnet tool restore

      - name: Run mutation tests
        env:
          MutationTesting: true
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/mutation-testing"
          "$GITHUB_WORKSPACE/.dotnet/dotnet" stryker --output "$GITHUB_WORKSPACE/artifacts/mutation-testing" --skip-version-check | tee "$GITHUB_WORKSPACE/artifacts/mutation-testing/stryker-console.log"

      - name: Summarize mutation testing results
        if: ${{ always() }}
        run: |
          log="$GITHUB_WORKSPACE/artifacts/mutation-testing/stryker-console.log"
          if [ ! -f "$log" ]; then
            echo "## Mutation testing" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Stryker did not produce console output (the run likely failed before reporting)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Strip ANSI escape codes before scraping the summary lines Stryker prints.
          clean_log=$(sed -E 's/\x1b\[[0-9;]*m//g' "$log")

          killed=$(echo "$clean_log" | grep -oE 'Killed: *[0-9]+' | tail -n1 | grep -oE '[0-9]+' || true)
          survived=$(echo "$clean_log" | grep -oE 'Survived: *[0-9]+' | tail -n1 | grep -oE '[0-9]+' || true)
          timeout=$(echo "$clean_log" | grep -oE 'Timeout: *[0-9]+' | tail -n1 | grep -oE '[0-9]+' || true)
          score=$(echo "$clean_log" | grep -oE 'final mutation score is [0-9.]+ *%' | tail -n1 | grep -oE '[0-9.]+' || true)

          {
            echo "## Mutation testing (Stryker.NET)"
            echo ""
            if [ -n "$score" ]; then
              echo "**Mutation score: ${score}%**"
            else
              echo "⚠️ Could not determine the mutation score from Stryker's output; see the \`mutation-testing-report\` artifact uploaded by this run for the raw log."
            fi
            echo ""
            echo "| Killed | Survived | Timeout |"
            echo "| --- | --- | --- |"
            echo "| ${killed:-?} | ${survived:-?} | ${timeout:-?} |"
            echo ""
            echo "Full HTML/JSON report: download the \`mutation-testing-report\` artifact from this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-testing-report
          path: artifacts/mutation-testing/
          if-no-files-found: error
          retention-days: 30
