name: Check source file BOMs

on:
  pull_request:
    paths:
      - '**.cs'
      - '**.csx'
      - '**.vb'
      - '**.vbx'
      - '.editorconfig'
      - '.github/scripts/check_source_bom.py'
      - '.github/scripts/test_check_source_bom.py'
      - '.github/workflows/check-source-bom.yml'
  push:
    branches:
      - main
      - 'rel/*'
    paths:
      - '**.cs'
      - '**.csx'
      - '**.vb'
      - '**.vbx'
      - '.editorconfig'
      - '.github/scripts/check_source_bom.py'
      - '.github/scripts/test_check_source_bom.py'
      - '.github/workflows/check-source-bom.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-source-bom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check source file BOMs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test BOM checker
        run: python .github/scripts/test_check_source_bom.py
      - name: Check source file BOMs
        run: python .github/scripts/check_source_bom.py
