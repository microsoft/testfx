name: Experimental Bazel build

on:
  pull_request:
    paths:
      - '.bazel*'
      - 'BUILD.bazel'
      - 'MODULE.bazel*'
      - 'eng/bazel.ps1'
      - 'eng/bazel/**'
      - 'eng/Versions.props'
      - '.editorconfig'
      - 'src/**'
      - 'test/**'
      - 'samples/public/mstest-runner/Simple1/**'
      - 'samples/public/TestingPlatformExamples/TestingPlatformExplorer/**'
      - '.github/workflows/bazel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Native Bazel baseline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, test, and validate native consumers
        shell: pwsh
        run: .\eng\bazel\validate.ps1
      - name: Preserve baseline evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-${{ matrix.os }}
          path: artifacts/bazel-validation/
          if-no-files-found: warn
      - name: Stop the worktree's Bazel server
        if: always()
        shell: pwsh
        run: .\eng\bazel.ps1 shutdown
