name: Test GitHub Actions attachments

on:
  pull_request:
    paths:
      - 'src/Platform/Microsoft.Testing.Extensions.GitHubActionsReport/**'
      - 'src/Platform/SharedExtensionHelpers/**'
      - 'src/Platform/Microsoft.Testing.Platform/**'
      - 'src/Platform/Microsoft.Testing.Platform.MSBuild/**'
      - 'src/Platform/Microsoft.Testing.Extensions.TrxReport*/**'
      - 'src/Adapter/**'
      - 'src/TestFramework/**'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
      - 'eng/**'
      - '.github/scripts/test-gh-attachments.ps1'
      - '.github/workflows/test-gh-attachments.yml'
  push:
    branches: [main]
    paths:
      - 'src/Platform/Microsoft.Testing.Extensions.GitHubActionsReport/**'
      - 'src/Platform/SharedExtensionHelpers/**'
      - 'src/Platform/Microsoft.Testing.Platform/**'
      - 'src/Platform/Microsoft.Testing.Platform.MSBuild/**'
      - 'src/Platform/Microsoft.Testing.Extensions.TrxReport*/**'
      - 'src/Adapter/**'
      - 'src/TestFramework/**'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
      - 'eng/**'
      - '.github/scripts/test-gh-attachments.ps1'
      - '.github/workflows/test-gh-attachments.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-gh-attachments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shipping-attachments:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pack shipping products
        run: ./build.sh -pack -c Release -bl
      - name: Reject Linux FIFO attachment sources
        run: >-
          ./.dotnet/dotnet test
          --project test/UnitTests/Microsoft.Testing.Extensions.UnitTests/Microsoft.Testing.Extensions.UnitTests.csproj
          --configuration Release --framework net8.0 --no-build --no-restore
          -p:EnableCodeCoverage=false
          -bl:artifacts/log/Release/fifo-regression-{}.binlog
          --filter FullyQualifiedName~GitHubActionsSummaryReporterTests.SessionFinishing_LinuxFifo_RejectsBeforeOpenAndPreservesPrimarySummary
          --minimum-expected-tests 2
          --report-trx --report-trx-filename fifo-regression.trx
          --results-directory artifacts/TestResults/fifo-regression
      - name: Exercise packed MSTest and GitHub Actions report
        shell: pwsh
        run: ./.github/scripts/test-gh-attachments.ps1 -WorkDirectory "${{ runner.temp }}/mtp-attachment-smoke"
      - name: Upload failed-test attachments
        id: attachments
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-test-attachments-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mtp-attachment-smoke/attachments
          if-no-files-found: ignore
          retention-days: 7
      - name: Link uploaded attachments
        if: always() && steps.attachments.outputs.artifact-url != ''
        shell: pwsh
        env:
          ATTACHMENT_URL: ${{ steps.attachments.outputs.artifact-url }}
          ATTACHMENT_ROOT: ${{ runner.temp }}/mtp-attachment-smoke/attachments
        run: |
          # Execute the user-facing sample verbatim so documentation and hosted behavior cannot drift.
          $readme = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'src/Platform/Microsoft.Testing.Extensions.GitHubActionsReport/PACKAGE.md'))
          $sample = [regex]::Match($readme, '(?ms)^  - name: Link failed-test attachments\r?\n.*?^    run: \|\r?\n(?<script>.*?)^```')
          if (-not $sample.Success) { throw 'The documented attachment summary sample was not found.' }
          $script = ($sample.Groups['script'].Value -split '\r?\n' | ForEach-Object {
            if ($_.Length -eq 0) { '' } elseif ($_.StartsWith('      ')) { $_.Substring(6) } else { throw 'Unexpected sample indentation.' }
          }) -join "`n"
          & ([scriptblock]::Create($script))
          Copy-Item -LiteralPath $env:GITHUB_STEP_SUMMARY -Destination "${{ runner.temp }}/mtp-attachment-smoke/linked.summary.md"
      - name: Download the real uploaded archive
        if: success() && steps.attachments.outputs.artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.attachments.outputs.artifact-id }}
          path: ${{ runner.temp }}/mtp-attachment-download
          merge-multiple: true
      - name: Verify the downloaded bytes and associations
        shell: pwsh
        env:
          ATTACHMENT_URL: ${{ steps.attachments.outputs.artifact-url }}
        run: ./.github/scripts/test-gh-attachments.ps1 -Mode Verify -WorkDirectory "${{ runner.temp }}/mtp-attachment-smoke" -DownloadDirectory "${{ runner.temp }}/mtp-attachment-download"
      - name: Preserve reproducible evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attachment-validation-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mtp-attachment-smoke/**/*.log
            ${{ runner.temp }}/mtp-attachment-smoke/**/*.binlog
            ${{ runner.temp }}/mtp-attachment-smoke/**/*.trx
            ${{ runner.temp }}/mtp-attachment-smoke/**/*.summary.md
            ${{ runner.temp }}/mtp-attachment-smoke/**/obj/project.assets.json
            ${{ runner.temp }}/mtp-attachment-smoke/**/bin/Release/net8.0/*.deps.json
            ${{ runner.temp }}/mtp-attachment-smoke/packages.json
            ${{ runner.temp }}/mtp-attachment-smoke/expected.json
            artifacts/log/Release
            artifacts/TestResults/fifo-regression
          if-no-files-found: ignore
          retention-days: 7
