name: Test GitHub Actions attachments

on:
  pull_request:
    paths:
      - 'src/Platform/Microsoft.Testing.Extensions.GitHubActionsReport/**'
      - 'src/Platform/SharedExtensionHelpers/**'
      - '.github/scripts/test-gh-attachments.ps1'
      - '.github/workflows/test-gh-attachments.yml'
  push:
    branches: [main]
    paths:
      - 'src/Platform/Microsoft.Testing.Extensions.GitHubActionsReport/**'
      - 'src/Platform/SharedExtensionHelpers/**'
      - '.github/scripts/test-gh-attachments.ps1'
      - '.github/workflows/test-gh-attachments.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: test-gh-attachments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shipping-attachments:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pack shipping products
        run: ./build.sh -pack -c Release -bl
      - name: Exercise packed MSTest and GitHub Actions report
        shell: pwsh
        run: ./.github/scripts/test-gh-attachments.ps1 -WorkDirectory "${{ runner.temp }}/mtp-attachment-smoke"
      - name: Upload failed-test attachments
        id: attachments
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-test-attachments-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mtp-attachment-smoke/attachments
          if-no-files-found: ignore
          retention-days: 7
      - name: Link uploaded attachments
        if: always() && steps.attachments.outputs.artifact-url != ''
        shell: pwsh
        env:
          ATTACHMENT_URL: ${{ steps.attachments.outputs.artifact-url }}
        run: |
          "## Failed-test attachments" >> $env:GITHUB_STEP_SUMMARY
          "[Download attachments and test association manifests]($env:ATTACHMENT_URL)" >> $env:GITHUB_STEP_SUMMARY
      - name: Download the real uploaded archive
        if: success() && steps.attachments.outputs.artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.attachments.outputs.artifact-id }}
          path: ${{ runner.temp }}/mtp-attachment-download
          merge-multiple: true
      - name: Verify the downloaded bytes and associations
        shell: pwsh
        run: ./.github/scripts/test-gh-attachments.ps1 -Mode Verify -WorkDirectory "${{ runner.temp }}/mtp-attachment-smoke" -DownloadDirectory "${{ runner.temp }}/mtp-attachment-download"
      - name: Preserve reproducible evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attachment-validation-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mtp-attachment-smoke/**/*.log
            ${{ runner.temp }}/mtp-attachment-smoke/**/*.binlog
            ${{ runner.temp }}/mtp-attachment-smoke/**/*.trx
            ${{ runner.temp }}/mtp-attachment-smoke/**/*.summary.md
            ${{ runner.temp }}/mtp-attachment-smoke/packages.json
            ${{ runner.temp }}/mtp-attachment-smoke/expected.json
            artifacts/log/Release
          if-no-files-found: ignore
          retention-days: 7
