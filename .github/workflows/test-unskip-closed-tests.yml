name: Test unskip closed tests helper

on:
  pull_request:
    paths:
      - '.github/scripts/test_unskip_closed_tests_verify.ps1'
      - '.github/agents/unskip-closed-tests.agent.md'
      - '.github/workflows/unskip-closed-tests.config.json'
      - '.github/workflows/unskip-closed-tests-prepare.md'
      - '.github/workflows/unskip-closed-tests-shared.md'
      - '.github/workflows/unskip-closed-tests-tool/**'
      - '.github/workflows/unskip-closed-tests-verify.ps1'
      - '.github/workflows/test-unskip-closed-tests.yml'
      - '.github/workflows/unskip-closed-tests.md'
  push:
    branches:
      - main
      - 'rel/*'
    paths:
      - '.github/scripts/test_unskip_closed_tests_verify.ps1'
      - '.github/agents/unskip-closed-tests.agent.md'
      - '.github/workflows/unskip-closed-tests.config.json'
      - '.github/workflows/unskip-closed-tests-prepare.md'
      - '.github/workflows/unskip-closed-tests-shared.md'
      - '.github/workflows/unskip-closed-tests-tool/**'
      - '.github/workflows/unskip-closed-tests-verify.ps1'
      - '.github/workflows/test-unskip-closed-tests.yml'
      - '.github/workflows/unskip-closed-tests.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-unskip-closed-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test unskip closed tests helper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pwsh -NoLogo -NoProfile -File .github/scripts/test_unskip_closed_tests_verify.ps1
