version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 15
    labels:
      - dependencies
    groups:
      roslyn-testing:
        patterns:
          - "Microsoft.CodeAnalysis.*.Testing"
    ignore:
      # Roslyn APIs are supplied by the compiler/IDE host, not bundled.
      # Keep the 4.14 host baseline; intentional upgrades also need minimum-host
      # compatibility coverage and regenerated native producer/test lockfiles.
      # Leave patch/security and analyzer-authoring/testing package updates enabled.
      - dependency-name: "Microsoft.CodeAnalysis"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "Microsoft.CodeAnalysis.Common"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # handled by Darc/Maestro flows
      - dependency-name: "Microsoft.DotNet.Arcade.Sdk"
      - dependency-name: "Microsoft.CodeCoverage.MSBuild"
      - dependency-name: "Microsoft.Testing.Extensions.CodeCoverage"
      - dependency-name: "MSTest.TestAdapter"
      - dependency-name: "MSTest.TestFramework"
      - dependency-name: Moq
    commit-message:
      prefix: '[main] '
  - package-ecosystem: nuget
    directory: "/samples/public"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # handled by Darc/Maestro flows
      - dependency-name: "Microsoft.DotNet.Arcade.Sdk"
      - dependency-name: Moq
    commit-message:
      prefix: '[main] '
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    labels:
      - dependencies
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    ignore:
      # The github/gh-aw-actions/* and github/gh-aw/actions/setup actions are
      # pinned by `gh aw compile` and
      # MUST move in lockstep with the gh-aw CLI version that generated the
      # `.lock.yml` files (and `.github/aw/actions-lock.json`). Letting
      # Dependabot bump just the `uses:` SHAs drifts them away from the
      # generator, which breaks the threat-detection job with
      # `awf: command not found` -> parse_error (see #10203). These are
      # updated via `gh aw upgrade` / the Agentic Maintenance workflow instead.
      - dependency-name: "github/gh-aw-actions/*"
      - dependency-name: "github/gh-aw/actions/setup"
      # DavidAnson/markdownlint-cli2-action pins the CLI version it bundles, and
      # `.github/workflows/markdown-linter.md` installs that same version by hand so the
      # scheduled report and the pull request gate apply identical rules. Dependabot can
      # only see the action, so letting it bump alone would silently give the two different
      # rule sets. Move both pins together, by hand, when updating the action.
      - dependency-name: "DavidAnson/markdownlint-cli2-action"
    commit-message:
      prefix: '[main] '
    cooldown:
      default-days: 7
