        - skills/mtp-hot-reload
        - skills/platform-detection
        - skills/run-tests
        - skills/scaffold-dotnet-test-project
        - skills/test-analysis-extensions
        - skills/test-anti-patterns
        - skills/test-gap-analysis
        - skills/test-smell-detection
        - skills/test-tagging
        - skills/testability-obstacle
