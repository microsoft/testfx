# .copilot/curate/manifest.yml — declared skill/agent intent.
# Edit this file by hand to declare which plugins this repo wants.
# Run "gh copilot-curate sync" (or any "gh copilot-curate" mutating command) to apply.
version: 1
plugins:
    - id: dotnet-test
      source: dotnet/skills
      ref: 998ae280637d9a0c7f9ae414d853525c4aea069b
      # Keep framework/platform migration skills and their dispatcher out of updates.
      include:
        - skills/assertion-quality/
        - skills/code-testing-agent/
        - skills/code-testing-extensions/
        - skills/coverage-analysis/
        - skills/crap-score/
        - skills/detect-static-dependencies/
        - skills/dotnet-test-frameworks/
        - skills/filter-syntax/
        - skills/generate-testability-wrappers/
        - skills/grade-tests/
        - skills/migrate-static-to-wrapper/
        - skills/mtp-hot-reload/
        - skills/platform-detection/
        - skills/run-tests/
        - skills/test-analysis-extensions/
        - skills/test-anti-patterns/
        - skills/test-gap-analysis/
        - skills/test-smell-detection/
        - skills/test-tagging/
        - skills/writing-mstest-tests/
        - agents/code-testing-builder.agent.md
        - agents/code-testing-fixer.agent.md
        - agents/code-testing-generator.agent.md
        - agents/code-testing-implementer.agent.md
        - agents/code-testing-linter.agent.md
        - agents/code-testing-planner.agent.md
        - agents/code-testing-researcher.agent.md
        - agents/code-testing-tester.agent.md
        - agents/test-quality-auditor.agent.md
        - agents/testability-migration.agent.md
      install:
        mode: summary
    - id: dotnet-msbuild
      source: dotnet/skills
      ref: main
      install:
        mode: summary
