# Branches that trigger a build on commit
trigger:
  branches:
    include:
    - main
    - rel/*
    exclude:
    - rel/2.*
    - rel/3.0.*
  paths:
    exclude:
      - .github/**
      - .gitignore
      - azure-pipelines-codeql.yml
      # The official pipeline ships product packages. The samples/** folder is not part of the
      # shipping product (it is built by the PR pipeline via eng/build-samples.ps1). Skip the
      # official pipeline for samples-only changes.
      - samples/**
      - eng/build-samples.ps1

parameters:
- name: isRTM
  displayName: "Produce RTM version?"
  type: boolean
  default: False
- name: products
  displayName: "Select the products to generate"
  type: string
  default: all
  values:
  - all
  - mstest
  - testing-platform
# This option should be used with caution. This is useful for unblocking circular deps issue with testanywhere
- name: SkipTests
  displayName: "Skip tests"
  type: boolean
  default: False
- name: codeQLForce
  displayName: "Try collecting CodeQL before default CodeQL cadence"
  type: boolean
  default: False

variables:
  - template: /eng/common/templates-official/variables/pool-providers.yml@self
  # Cannot use key:value syntax in root defined variables
  - name: _TeamName
    value: MSTest
  - name: _RunAsInternal
    value: True
  - name: _RunAsPublic
    value: False
  - name: _ReleaseVersionKind
    value: ''
  - name: _BuildConfig
    value: Release
  - name: _Products
    value: ${{parameters.products}}
  # _SignType and _Sign are required for signing even if not used directly here
  - name: _SignType
    value: real
  - name: _Sign
    value: True

  - ${{ if eq(parameters.isRTM, True) }}:
    - name: _ReleaseVersionKind
      value: release
  
  # Set to 0 to force CodeQL scan without waiting 72 from last attempt (even if it failed).
  # This is only a hint for the tool, it might reject to run it if it already has up to date data.
  # See the Starting Code QL step for details.
  - ${{ if eq(parameters.codeQLForce, True) }}:
    - name: Codeql.Cadence 
      value: 0

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      policheck:
        enabled: true
      tsa:
        enabled: true
      componentgovernance:
        # .dotnet/ is the repo-local .NET SDK bootstrapped by eng/common/tools.ps1 from global.json,
        # plus the workloads installed by eng/restore-toolset.ps1. It is not checked in (see .gitignore)
        # and nothing in it ships. Scanning it surfaces alerts for components we cannot service, such as
        # the npm packages vendored inside Microsoft.NET.Runtime.Emscripten.*.Sdk/tools/emscripten/node_modules,
        # which are owned by dotnet/runtime and pinned by the SDK pack.
        ignoreDirectories: $(Build.SourcesDirectory)/.dotnet
    featureFlags:
      autoBaseline: true
    pool:
      name: $(DncEngInternalBuildPool)
      image: windows.vs2026preview.scout.amd64
      os: windows
    settings:
      networkIsolationPolicy: Permissive,CFSClean
    customBuildTags:
    - ES365AIMigrationTooling
    stages:

    - stage: build
      displayName: Build
      jobs:

      - template: /eng/common/templates-official/jobs/jobs.yml@self
        parameters:
          enableMicrobuild: true
          enablePublishTestResults: true
          testResultsFormat: 'vstest'
          publishingVersion: 4
          artifacts:
            publish:
              logs: true
              manifests: true
          enableTelemetry: true
          jobs:
          - job: Windows
            enablePublishing: true
            timeoutInMinutes: 90
            pool:
              name: $(DncEngInternalBuildPool)
              image: windows.vs2026preview.scout.amd64
              os: windows
            steps:
            - template: /eng/pipelines/steps/install-windows-prereqs.yml@self

            - script: eng\common\CIBuild.cmd
                -configuration $(_BuildConfig)
                -prepareMachine
                /p:TeamName=$(_TeamName)
                /p:DotNetFinalVersionKind=$(_ReleaseVersionKind)
                /p:OfficialBuildId=$(BUILD.BUILDNUMBER)
                /p:ProductsToBuild=$(_Products)
                /p:Test=false
              name: Build
              displayName: Build
              env:
                # https://github.com/microsoft/testfx/issues/6767
                DOTNET_HOST_PATH: '$(Build.SourcesDirectory)/.dotnet/dotnet.exe'

            - ${{ if eq(parameters.SkipTests, False) }}:
              # -ci is allowing to import some environment variables and some required configurations
              - script: Test.cmd
                  -configuration $(_BuildConfig)
                  -ci
                  -nobl
                  /bl:$(BUILD.SOURCESDIRECTORY)\artifacts\TestResults\$(_BuildConfig)\TestStep.binlog
                name: Test
                displayName: Test
                env:
                  TESTINGPLATFORM_DEFAULT_HANG_TIMEOUT: 5m
                  DOTNET_ROOT: $(Build.SourcesDirectory)/.dotnet
                  # Expose the build's OAuth token so the report-azdo history options (slow-test-history /
                  # flaky-history injected by test/Directory.Build.targets) can query this pipeline's own
                  # test-result history. Secret variables are not auto-exposed to scripts, so the explicit
                  # mapping is required; the history service no-ops if the token or endpoints are unavailable.
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)

              # The integration suite only creates artifacts/tmp/$(_BuildConfig)/testsuite once it runs, and
              # CopyFiles@2 hard-fails when SourceFolder does not exist. A Test failure early enough to skip
              # the suite therefore reported one real problem as three failed steps: Test, Copy binlogs, and
              # Publish integration tests binlogs all failed in
              # https://dev.azure.com/dnceng/internal/_build/results?buildId=3045544. Probe for the binlogs so
              # both steps skip when there are none. When the suite did produce binlogs they are copied and
              # published exactly as before, including on a failed run, which is why these use always().
              - pwsh: |
                  $testsuite = Join-Path '$(Build.SourcesDirectory)' 'artifacts/tmp/$(_BuildConfig)/testsuite'
                  $hasBinlogs = 'false'
                  if (Test-Path -LiteralPath $testsuite -PathType Container) {
                    $binlog = Get-ChildItem -LiteralPath $testsuite -Filter '*.binlog' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
                    if ($null -ne $binlog) { $hasBinlogs = 'true' }
                  }
                  Write-Host "Integration tests binlogs under '$testsuite': $hasBinlogs"
                  Write-Host "##vso[task.setvariable variable=HasIntegrationTestBinlogs]$hasBinlogs"
                displayName: 'Check for integration tests binlogs'
                condition: always()

              - task: CopyFiles@2
                displayName: 'Copy binlogs'
                inputs:
                  SourceFolder: '$(Build.SourcesDirectory)/artifacts/tmp/$(_BuildConfig)/testsuite'
                  Contents: |
                    **/*.binlog
                  TargetFolder: '$(Build.ArtifactStagingDirectory)/binlogs'
                condition: and(always(), eq(variables.HasIntegrationTestBinlogs, 'true'))

              - task: 1ES.PublishBuildArtifacts@1
                displayName: 'Publish integration tests binlogs'
                inputs:
                  PathtoPublish: '$(Build.ArtifactStagingDirectory)/binlogs'
                  ArtifactName: Integration_Tests_Windows_Binlogs_$(_BuildConfig)
                condition: and(always(), eq(variables.HasIntegrationTestBinlogs, 'true'))

              # Remove temporary artifacts to avoid finding binskim issues for exes we don't own.
              - pwsh: |
                  Remove-Item -Path $(Build.SourcesDirectory)/artifacts/tmp -Recurse -Force
                displayName: Remove artifacts/tmp

              # artifacts/TestResults/$(_BuildConfig) only exists once a test step has written into it, and
              # 1ES.PublishBuildArtifacts@1 hard-fails when PathtoPublish does not exist. A job that dies
              # before the tests run therefore reported one real problem as two failed steps: an Azure
              # Artifacts outage broke Install MicroBuild plugin, which skipped Build and Test, and this step
              # then failed with "Not found PathtoPublish" in
              # https://dev.azure.com/dnceng/internal/_build/results?buildId=3057151. Probe for the folder so
              # the publish skips when there is nothing to publish. When the tests did write results they are
              # published exactly as before, including on a failed run, which is why this uses always().
              - pwsh: |
                  $testResults = Join-Path '$(Build.SourcesDirectory)' 'artifacts/TestResults/$(_BuildConfig)'
                  $hasTestResults = 'false'
                  if (Test-Path -LiteralPath $testResults -PathType Container) { $hasTestResults = 'true' }
                  Write-Host "Test results under '$testResults': $hasTestResults"
                  Write-Host "##vso[task.setvariable variable=HasTestResults]$hasTestResults"
                displayName: 'Check for Test Results folders'
                condition: always()

              - task: 1ES.PublishBuildArtifacts@1
                displayName: 'Publish Test Results folders'
                inputs:
                  PathtoPublish: '$(Build.SourcesDirectory)/artifacts/TestResults/$(_BuildConfig)'
                  ArtifactName: TestResults_Windows_Attempt$(System.JobAttempt)
                condition: and(always(), eq(variables.HasTestResults, 'true'))

            - task: NuGetAuthenticate@1
              displayName: 'NuGet Authenticate to test-tools feed'

              # Final builds should not go into test-tools package feed, so we can keep re-building them until we are ready to ship to nuget.org.
              # This has to depend on the parameter and not on variable, variables are not defined early enough to be used in templating condition.
              # We still need the final builds on test-tools so that internal repos can consume it, so we will publish it manually.
            # Remove vulnerable packages from NuGet cache before Component Governance scan.
            # Microsoft.AspNetCore.App.Runtime 6.0.12 is flagged as vulnerable but is not directly referenced
            # by this repo. It appears in the NuGet cache as a transitive dependency resolved during build.
            - pwsh: |
                $cacheRoots = @(
                    "$(Build.SourcesDirectory)/.packages",
                    "$(Build.SourcesDirectory)/packages"
                )
                $vulnerablePackages = @(
                    "microsoft.aspnetcore.app.runtime.win-arm64/6.0.12"
                )
                foreach ($root in $cacheRoots) {
                    foreach ($pkg in $vulnerablePackages) {
                        $pkgPath = Join-Path $root $pkg
                        if (Test-Path $pkgPath) {
                            Remove-Item -Path $pkgPath -Recurse -Force
                            Write-Host "Removed vulnerable package: $pkgPath"
                        }
                    }
                }
              displayName: Remove vulnerable packages from NuGet cache

            - ${{ if eq(parameters.isRTM, False) }}:
              - task: 1ES.PublishNuget@1
                displayName: 'Publish NuGet packages to test-tools feed'
                inputs:
                  # Do not push symbol packages nor Microsoft.Testing.Platform package
                  packageParentPath: '$(Build.SourcesDirectory)/artifacts/packages/$(_BuildConfig)'
                  packagesToPush: '$(Build.SourcesDirectory)/artifacts/packages/$(_BuildConfig)/**/*.nupkg;!$(Build.SourcesDirectory)/artifacts/packages/$(_BuildConfig)/**/*.symbols.nupkg;!$(Build.SourcesDirectory)/artifacts/packages/$(_BuildConfig)/NonShipping/Microsoft.Testing.Platform.*.nupkg'
                  publishVstsFeed: 'public/test-tools'

          - job: Linux
            timeoutInMinutes: 90
            pool:
              name: $(DncEngInternalBuildPool)
              image: 1es-ubuntu-2204
              os: linux
            steps:
            - script: eng/common/build.sh
                -configuration $(_BuildConfig)
                -prepareMachine
                --ci
                --restore
                --build
                --pack
                /p:Test=false
                /p:NonWindowsBuild=true
              displayName: Build

            - ${{ if eq(parameters.SkipTests, False) }}:
              # -ci is allowing to import some environment variables and some required configurations
              - script: |
                  chmod +x ./test.sh
                  ./test.sh --configuration $(_BuildConfig) --ci --test --integrationTest --nobl /bl:$(BUILD.SOURCESDIRECTORY)/artifacts/TestResults/$(_BuildConfig)/TestStep.binlog
                name: Test
                displayName: Tests
                env:
                  TESTINGPLATFORM_DEFAULT_HANG_TIMEOUT: 5m
                  DOTNET_ROOT: $(Build.SourcesDirectory)/.dotnet
                  # Expose the build's OAuth token so the report-azdo history options (slow-test-history /
                  # flaky-history injected by test/Directory.Build.targets) can query this pipeline's own
                  # test-result history. Secret variables are not auto-exposed to scripts, so the explicit
                  # mapping is required; the history service no-ops if the token or endpoints are unavailable.
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)

              # artifacts/TestResults/$(_BuildConfig) only exists once a test step has written into it, and
              # 1ES.PublishBuildArtifacts@1 hard-fails when PathtoPublish does not exist. A job that dies
              # before the tests run therefore reported one real problem as two failed steps, the way the
              # Windows job did in
              # https://dev.azure.com/dnceng/internal/_build/results?buildId=3057151. Probe for the folder so
              # the publish skips when there is nothing to publish. When the tests did write results they are
              # published exactly as before, including on a failed run, which is why this uses always().
              - pwsh: |
                  $testResults = Join-Path '$(Build.SourcesDirectory)' 'artifacts/TestResults/$(_BuildConfig)'
                  $hasTestResults = 'false'
                  if (Test-Path -LiteralPath $testResults -PathType Container) { $hasTestResults = 'true' }
                  Write-Host "Test results under '$testResults': $hasTestResults"
                  Write-Host "##vso[task.setvariable variable=HasTestResults]$hasTestResults"
                displayName: 'Check for Test Results folders'
                condition: always()

              - task: 1ES.PublishBuildArtifacts@1
                displayName: 'Publish Test Results folders'
                inputs:
                  PathtoPublish: '$(Build.SourcesDirectory)/artifacts/TestResults/$(_BuildConfig)'
                  ArtifactName: TestResults_Linux_Attempt$(System.JobAttempt)
                condition: and(always(), eq(variables.HasTestResults, 'true'))

    # Localization runs in its own stage rather than as a job of `build`.
    # OneLocBuild hands the resource strings off to the loc service and then opens a PR back into
    # microsoft/testfx using the shared dnceng `BotAccount-dotnet-bot-repo-PAT` secret. That check-in
    # step can fail for reasons unrelated to the product (for example the "Microsoft Open Source"
    # GitHub enterprise rejecting the shared classic PAT). While it was a job of `build`, such a
    # failure failed the whole stage, which skipped the post-build `Validate Build Assets` and
    # `Publish using Darc` stages (both depend on `build`) and silently stopped official publishing.
    # Nothing that ships depends on the loc PR, so the stage stands alone: a break still turns the
    # build red, but it no longer blocks publishing. Mirrors the dotnet/runtime layout.
    # See https://github.com/microsoft/testfx/issues/10322 for the current PAT policy breakage.
    - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
      - stage: Localization
        # OneLocBuild only needs the sources, so it can run in parallel with `build`.
        dependsOn: []
        jobs:
        - template: /eng/common/templates-official/job/onelocbuild.yml@self
          parameters:
            GitHubOrg: microsoft
            MirrorRepo: testfx
            LclSource: lclFilesfromPackage
            LclPackageId: 'LCL-JUNO-PROD-TESTFX'

    - template: eng/common/templates-official/post-build/post-build.yml@self
      parameters:
        publishingInfraVersion: 4
